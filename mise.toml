# omapixel — a pixel art and animation studio.
#
# One entry point for everything: `mise run` lists it. There is no Makefile and
# no scripts under bin/, because two ways to build a project is one way too
# many -- the second is always the one that rots.
#
# Qt is a system dependency, not a mise tool. mise manages toolchains it can
# fetch; a C++/Qt build wants the distribution's Qt so the binary links against
# the same libraries the desktop already runs. `mise run deps` checks for it and
# tells you the one command that fixes it.

[tools]
# Nothing to fetch. The build needs a C++ compiler, make and Qt 6, all of which
# come from the system -- see `mise run deps`. This block stays as the place to
# put a tool the day one is genuinely needed.

[env]
BUILD_DIR = "{{config_root}}/build"

# ---------------------------------------------------------------------- deps

[tasks.deps]
description = "Check the system dependencies, and say how to install what is missing"
run = """
missing=""
for tool in qmake6 g++ make zstd; do
  command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
done
# The Qt modules the .pro files ask for. Present as headers rather than as
# binaries, so `command -v` cannot see them.
for header in QtCore/QCoreApplication QtGui/QImage QtTest/QtTest QtQuick/QQuickWindow; do
  ls /usr/include/qt6/$header >/dev/null 2>&1 || missing="$missing $header"
done

if [ -z "$missing" ]; then
  echo "all present — qt $(qmake6 -query QT_VERSION), $(g++ --version | head -1)"
  exit 0
fi

echo "missing:$missing" >&2
echo >&2
echo "on Arch / Omarchy:" >&2
echo "  sudo pacman -S --needed qt6-base qt6-declarative gcc make zstd" >&2
exit 1
"""

# --------------------------------------------------------------------- build

[tasks.build]
description = "Build the CLI and the studio"
depends = ["build-toolchain"]
run = """
mkdir -p "$BUILD_DIR"
cd "$BUILD_DIR"
qmake6 "{{config_root}}/omapixel.pro"
make -j"$(nproc 2>/dev/null || echo 1)"
echo
echo "cli    $BUILD_DIR/bin/omapixel"
echo "studio $BUILD_DIR/bin/omapixel-studio"
"""

[tasks.build-toolchain]
description = "Discard build objects compiled with an obsolete Qt or compiler"
depends = ["deps"]
run = '''
qt_archdata="$(qmake6 -query QT_INSTALL_ARCHDATA)"
qt_libs="$(qmake6 -query QT_INSTALL_LIBS)"

file_identity() {
  stat -Lc '%Y:%s' "$1"
}

signature="qmake=$(command -v qmake6)
qt=$(qmake6 -query QT_VERSION)
qconfig=$(file_identity "$qt_archdata/mkspecs/qconfig.pri")
qtcore=$(file_identity "$qt_libs/libQt6Core.so.6")
qtquick=$(file_identity "$qt_libs/libQt6Quick.so.6")
cxx=$(command -v g++)
compiler=$(g++ -dumpfullversion -dumpversion)"
stamp="$BUILD_DIR/.toolchain"
previous="$(cat "$stamp" 2>/dev/null || true)"

if [ "$signature" != "$previous" ]; then
  if [ -d "$BUILD_DIR" ] || [ -d "{{config_root}}/build-tests" ] \
     || [ -d "{{config_root}}/build-benchmark" ]; then
    echo "Qt or compiler changed — discarding stale build objects"
  fi
  rm -rf "$BUILD_DIR" "{{config_root}}/build-tests" \
    "{{config_root}}/build-benchmark"
fi

mkdir -p "$BUILD_DIR"
printf '%s\n' "$signature" > "$stamp"
'''

[tasks.clean]
description = "Throw the build away"
run = """
rm -rf '{{config_root}}/build' '{{config_root}}/build-tests' \
  '{{config_root}}/build-benchmark' '{{config_root}}/.qmake'
rm -f '{{config_root}}/.qmake.stash' '{{config_root}}/Makefile' \
  '{{config_root}}/target_wrapper.sh' '{{config_root}}/version.h' \
  '{{config_root}}'/*.o \
  '{{config_root}}'/moc_*.cpp '{{config_root}}'/qrc_*.cpp
"""

# --------------------------------------------------------------------- tests

[tasks.build-tests]
description = "Build the Qt test executable"
depends = ["deps", "build"]
run = """
mkdir -p "{{config_root}}/build-tests"
cd "{{config_root}}/build-tests"
qmake6 "{{config_root}}/tests/tests.pro"
make -j"$(nproc 2>/dev/null || echo 1)"
"""

[tasks.test]
description = "Build and run the unit tests"
depends = ["build-tests"]
run = """
cd "{{config_root}}/build-tests"
# offscreen: the tests touch QImage and never open a window, and CI has no
# display. Without this Qt aborts on a missing platform plugin.
QT_QPA_PLATFORM=offscreen QT_QPA_PLATFORMTHEME= ./tst_omapixel
"""

[tasks.test-keyboard]
description = "Run the deterministic keyboard-accessibility contract"
depends = ["test"]
run = """
cd "{{config_root}}/build-tests"
QT_QPA_PLATFORM=offscreen QT_QPA_PLATFORMTHEME= ./tst_omapixel \
  layerDockIsAKeyboardLayerBrowser \
  layerToolKeyboardLifecycleAndConfirmationReturn \
  goToPixelMovesByExactZeroBasedCoordinates \
  theArrowKeysWalkAPixelCursorOverTheDrawing \
  pickupAndNumberShortcutsPaintASelectionWithTheCollectedColour \
  everyControlIsReachableWithTab \
  commandPaletteSearchesRunsAndNavigatesEveryRegion \
  keyboardFocusContractsCoverSheetsFieldsAndDisabledRegions \
  theColourPanelIsDrivenFromTheKeyboardAlone \
  pointerOperationsDeclareAKeyboardRoute
"""

[tasks.test-keyboard-wayland]
description = "Run keyboard journeys through a real nested Hyprland compositor"
depends = ["build", "test-keyboard"]
run = 'python3 "{{config_root}}/tests/test_keyboard_wayland.py"'

[tasks.i18n]
description = "Compare a language file against English — mise run i18n pt"
depends = ["build"]
run = '"$BUILD_DIR/bin/omapixel" i18n "$@"'

[tasks.i18n-surface]
description = "Audit QML user-facing strings against the English catalogue"
run = 'python3 "{{config_root}}/tests/test_i18n_surface.py"'

[tasks.gui-qml]
description = "Check Studio QML interaction and accessibility contracts"
run = 'python3 "{{config_root}}/tests/test_gui_qml.py"'

[tasks.format-v2]
description = "Run the executable v2 contract and canonical fixture tests"
run = 'python3 "{{config_root}}/tests/test_format_v2.py"'

[tasks.plugin-contract]
description = "Run the Plugin API 1 contract tests"
run = 'python3 "{{config_root}}/tests/test_plugin_contract.py"'

[tasks.plugin-discovery]
description = "Run deterministic local plugin discovery and inspection tests"
depends = ["build"]
run = 'python3 "{{config_root}}/tests/test_plugin_discovery.py"'

[tasks.plugin-run]
description = "Run synchronous one-shot CLI plugin execution checks"
depends = ["build"]
run = 'python3 "{{config_root}}/tests/test_plugin_run.py"'

[tasks.plugin-e2e]
description = "Run the complete real-binary CLI plugin acceptance matrix"
depends = ["build"]
run = 'python3 "{{config_root}}/tests/test_plugin_e2e.py"'

[tasks.properties-v2]
description = "Run deterministic property checks for every v2 schema domain"
run = 'python3 "{{config_root}}/tests/test_format_v2_properties.py"'

[tasks.cli-layers]
description = "Run deterministic CLI layer and batch contract tests"
depends = ["build"]
run = 'python3 "{{config_root}}/tests/test_cli_layers.py"'

[tasks.image-io]
description = "Run raster import and animated GIF export contracts"
depends = ["build"]
run = 'python3 "{{config_root}}/tests/test_image_io.py"'

[tasks.skill-e2e]
description = "Run the portable agent-skill content and installer contract"
depends = ["build"]
run = 'python3 "{{config_root}}/tests/test_skill.py"'

[tasks.dist-contract]
description = "Verify the staged release contains and discovers the agent skill"
depends = ["dist"]
run = '''
version="${OMAPIXEL_VERSION:-$(git -C '{{config_root}}' describe --tags --always 2>/dev/null || echo 0.0.0)}"
version="${version#v}"
python3 "{{config_root}}/tests/test_skill_dist.py" \
  "{{config_root}}/dist/omapixel-$version-$(uname -m)"
'''

[tasks.layers-e2e]
description = "Run the CLI, Studio, where, render, flatten and live-reload fixture"
depends = ["build", "test"]
run = 'python3 "{{config_root}}/tests/test_layers_e2e.py"'

[tasks.benchmark-layers]
description = "Build and run the canonical multilayer performance gate"
depends = ["build-toolchain"]
run = """
mkdir -p "{{config_root}}/build-benchmark"
cd "{{config_root}}/build-benchmark"
qmake6 "{{config_root}}/tests/benchmarks/layer_benchmark.pro"
make -j"$(nproc 2>/dev/null || echo 1)"
"{{config_root}}/build-benchmark/layer_benchmark"
"""

[tasks.config]
description = "The settings file — mise run config check"
depends = ["build"]
run = '"$BUILD_DIR/bin/omapixel" config "$@"'

[tasks.check]
description = "Everything CI would run"
depends = ["build", "test", "format-v2", "plugin-contract", "plugin-e2e", "properties-v2", "cli-layers", "image-io",
           "skill-e2e", "dist-contract", "layers-e2e", "i18n", "i18n-surface", "gui-qml", "benchmark-layers",
           "test-keyboard", "test-keyboard-wayland"]
run = """
mise run studio-smoke
echo 'build, tests, and Studio startup are green'
"""

# ---------------------------------------------------------------------- dist

[tasks.dist]
description = "Stage the release tree under dist/ and tar it — what a release ships"
depends = ["build"]
run = """
# The tag drives the name in CI; a checkout gets whatever git can describe, so
# running this by hand still produces something you can unpack and look at.
version="${OMAPIXEL_VERSION:-$(git -C '{{config_root}}' describe --tags --always 2>/dev/null || echo 0.0.0)}"
version="${version#v}"
arch="$(uname -m)"
out="{{config_root}}/dist"
root="$out/omapixel-$version-$arch"

rm -rf "$root"
    mkdir -p "$root/bin" \
         "$root/share/omapixel/i18n" \
         "$root/share/omapixel/agents/skills/omapixel" \
         "$root/share/applications" \
         "$root/share/mime/packages" \
         "$root/share/icons/hicolor/scalable/apps" \
         "$root/share/licenses/omapixel" \
         "$root/share/doc/omapixel/docs" \
         "$root/share/doc/omapixel/examples"

install -m755 "$BUILD_DIR/bin/omapixel"        "$root/bin/omapixel"
install -m755 "$BUILD_DIR/bin/omapixel-studio" "$root/bin/omapixel-studio"
# A prefix tree, not a pile of files: the binaries find their catalogues and
# their default config at ../share/omapixel, so this unpacks anywhere and works
# -- and it is the same layout the packages lay down under /usr.
install -m644 "{{config_root}}"/i18n/*.json          "$root/share/omapixel/i18n/"
install -m644 "{{config_root}}/config/config.toml"   "$root/share/omapixel/config.toml"
install -m644 "{{config_root}}"/agents/skills/omapixel/*.md \
  "$root/share/omapixel/agents/skills/omapixel/"
install -m644 "{{config_root}}/packaging/omapixel-studio.desktop" "$root/share/applications/"
install -m644 "{{config_root}}/packaging/omapixel.xml" "$root/share/mime/packages/"
install -m644 "{{config_root}}/packaging/icon/omapixel.svg" "$root/share/icons/hicolor/scalable/apps/"
install -m644 "{{config_root}}/LICENSE"              "$root/share/licenses/omapixel/LICENSE"
install -m644 "{{config_root}}/README.md"            "$root/share/doc/omapixel/README.md"
install -m644 "{{config_root}}"/docs/*.md            "$root/share/doc/omapixel/docs/"
install -m644 "{{config_root}}"/docs/*.schema.json   "$root/share/doc/omapixel/docs/"
install -m644 "{{config_root}}/docs/studio.png"      "$root/share/doc/omapixel/docs/"
install -m644 "{{config_root}}/examples/README.md" \
  "$root/share/doc/omapixel/examples/README.md"
examples_root="{{config_root}}/examples"
while IFS= read -r -d '' example; do
  relative="${example#"$examples_root"/}"
  install -Dm644 "$example" "$root/share/doc/omapixel/examples/$relative"
done < <(find "$examples_root" -type f \\( -name '*.omapixel' -o -name '*.gif' \\) -print0)

tar -czf "$root.tar.gz" -C "$out" "omapixel-$version-$arch"
echo "$root.tar.gz"
"""

# --------------------------------------------------------------------- notes

[tasks.notes]
description = "The release notes for a tag — OMAPIXEL_TAG=v0.1.0 mise run notes"
run = '''
# What a release says it changed, out of what the history already knows. The
# alternative is a CHANGELOG.md kept by hand, which is the same information
# written twice and wrong once.
#
# Two sources, in this order:
#   1. The body of the tag annotation -- everything after its first line. That
#      is where a release says something the commits cannot, and `git tag -a`
#      with a one-line -m leaves it empty, so routine releases cost nothing.
#   2. The commits since the previous tag, grouped by their conventional
#      prefix. `feat(studio): x` becomes a line under Features.
# mise appends a task's arguments to the end of the script rather than passing
# them as $1, so the tag comes in the environment -- the same way `dist` takes
# OMAPIXEL_VERSION. In a checkout sitting on a tag, neither is needed.
tag="${OMAPIXEL_TAG:-}"
if [ -z "$tag" ]; then
  tag=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
fi
if [ -z "$tag" ]; then
  echo "which tag? — OMAPIXEL_TAG=v0.1.0 mise run notes" >&2
  exit 1
fi
if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null 2>&1; then
  echo "no tag $tag" >&2
  exit 1
fi

# GitHub sets the first; a checkout has a remote to ask.
repo="${GITHUB_REPOSITORY:-}"
if [ -z "$repo" ]; then
  repo=$(git remote get-url origin 2>/dev/null \
    | sed -e "s|^git@github.com:||" -e "s|^https://github.com/||" -e "s|\.git$||")
fi

# The first release has no previous tag to compare against, so it links to the
# commit list instead. Without this the whole task fails on v0.1.0.
prev=$(git describe --abbrev=0 --tags "$tag^" 2>/dev/null || true)
if [ -n "$prev" ]; then
  range="$prev..$tag"
  compare="https://github.com/$repo/compare/$prev...$tag"
else
  range="$tag"
  compare="https://github.com/$repo/commits/$tag"
fi

intro=$(git tag -l --format="%(contents:body)" "$tag")

dir=$(mktemp -d)
# One file per section, named so that sorting them is the running order.
# tformat, not format: `format` leaves the last line without a newline and
# `read` then drops it -- which silently loses the newest commit of a release.
git log --no-merges --reverse --pretty=tformat:"%h %s" "$range" | while read -r line; do
  hash=${line%% *}
  subject=${line#* }

  breaking=""
  case "$subject" in
    *": "*) head=${subject%%:*}; desc=${subject#*: } ;;
    *)      head=""; desc="$subject" ;;
  esac
  case "$head" in
    *!) breaking=yes; head=${head%!} ;;
  esac
  case "$head" in
    *"("*")") type=${head%%(*}; scope=${head#*(}; scope=${scope%)} ;;
    *)        type="$head"; scope="" ;;
  esac

  case "$type" in
    feat) file=2-feat ;;
    fix)  file=3-fix ;;
    perf) file=4-perf ;;
    docs) file=5-docs ;;
    refactor|test|build|ci|chore|style) file=6-other ;;
    # Not a conventional prefix at all: keep the subject whole rather than
    # cutting it at a colon that meant something else.
    *) file=6-other; desc="$subject"; scope=""; breaking="" ;;
  esac
  if [ -n "$breaking" ]; then file=1-breaking; fi

  if [ -n "$scope" ]; then
    echo "- **$scope**: $desc ($hash)" >> "$dir/$file"
  else
    echo "- $desc ($hash)" >> "$dir/$file"
  fi
done

{
  if [ -n "$intro" ]; then
    printf "%s\n\n" "$intro"
  fi

  for file in 1-breaking 2-feat 3-fix 4-perf 5-docs 6-other; do
    [ -f "$dir/$file" ] || continue
    case "$file" in
      1-breaking) echo "## Breaking changes" ;;
      2-feat)     echo "## Features" ;;
      3-fix)      echo "## Fixes" ;;
      4-perf)     echo "## Performance" ;;
      5-docs)     echo "## Documentation" ;;
      6-other)    echo "## Other changes" ;;
    esac
    echo
    cat "$dir/$file"
    echo
  done

  cat <<EOF
## Install

On Omarchy:

\`\`\`
sudo pacman -S omapixel
\`\`\`

From a checkout, with Qt 6 and a compiler present:

\`\`\`
mise run build && mise run install
\`\`\`
EOF

  echo
  printf "**Full Changelog**: %s\n" "$compare"
}

rm -rf "$dir"
'''

# ----------------------------------------------------------------------- run

[tasks.cli]
description = "Run the CLI — mise run cli -- check drawing.json"
depends = ["build"]
run = '"$BUILD_DIR/bin/omapixel" "$@"'

[tasks.studio]
description = "Open the studio — mise run studio -- drawing.json"
depends = ["build"]
run = '''
platform=""
wayland_display="${WAYLAND_DISPLAY:-}"
x_display="${DISPLAY:-}"

# Long-lived shells can outlive a compositor restart and lose or retain stale
# display variables. The user manager owns the current desktop environment, so
# recover from it before looking at sockets directly.
if [ -z "$wayland_display" ] || [ -z "$x_display" ]; then
  manager_environment="$(systemctl --user show-environment 2>/dev/null || true)"
  while IFS='=' read -r key value; do
    case "$key" in
      WAYLAND_DISPLAY) [ -z "$wayland_display" ] && wayland_display="$value" ;;
      DISPLAY)         [ -z "$x_display" ] && x_display="$value" ;;
    esac
  done <<EOF
$manager_environment
EOF
fi

if [ -n "$wayland_display" ] && [ -n "${XDG_RUNTIME_DIR:-}" ]; then
  case "$wayland_display" in
    /*) wayland_socket="$wayland_display" ;;
    *)  wayland_socket="$XDG_RUNTIME_DIR/$wayland_display" ;;
  esac
  [ -S "$wayland_socket" ] && platform="wayland"
fi

# The manager may be unavailable in a minimal shell. A Wayland socket is owned
# by this user and is sufficient to recover its display name.
if [ -z "$platform" ] && [ -n "${XDG_RUNTIME_DIR:-}" ]; then
  for candidate in "$XDG_RUNTIME_DIR"/wayland-*; do
    [ -S "$candidate" ] || continue
    wayland_display="${candidate##*/}"
    platform="wayland"
    break
  done
fi

if [ -z "$platform" ] && [ -n "$x_display" ]; then
  display_number="${x_display#:}"
  display_number="${display_number%%.*}"
  [ -S "/tmp/.X11-unix/X$display_number" ] && platform="xcb"
fi

# Screenshot smoke tests are useful in headless CI. An interactive invocation
# without a display should fail here with the real cause instead of Qt's long
# platform-plugin fallback error.
if [ -z "$platform" ] && [ -n "${OMAPIXEL_SHOT:-}" ]; then
  platform="offscreen"
fi
if [ -z "$platform" ]; then
  echo "no live Wayland or X11 display is available" >&2
  echo "WAYLAND_DISPLAY=$wayland_display DISPLAY=$x_display XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-}" >&2
  exit 1
fi

# GTK supplies the native file dialog on Omarchy. Keep the inherited platform
# theme for interactive launches, but do not load it in headless smoke tests.
if [ "$platform" = "offscreen" ]; then
  unset QT_QPA_PLATFORMTHEME
fi

WAYLAND_DISPLAY="$wayland_display" DISPLAY="$x_display" \
  QT_QPA_PLATFORM="$platform" "$BUILD_DIR/bin/omapixel-studio" "$@"
'''

[tasks.studio-smoke]
description = "Launch the Studio and its keyboard overlays, render frames, and exit"
depends = ["build"]
run = '''
base="${TMPDIR:-/tmp}/omapixel-studio-smoke-$$"
normal="$base-normal.png"
commands="$base-commands.png"
navigate="$base-navigate.png"
trap 'rm -f "$normal" "$commands" "$navigate"' EXIT

render() {
  mode="$1"
  shot="$2"
  OMAPIXEL_SHOT="$shot" OMAPIXEL_SHOT_SHEET="$mode" mise run studio
  if [ ! -s "$shot" ]; then
    echo "Studio startup produced no $mode screenshot" >&2
    exit 1
  fi
}

render "normal" "$normal"
render "commands" "$commands"
render "navigate" "$navigate"
echo "Studio startup and keyboard overlays are green"
'''

[tasks.install]
description = "Install the binaries, runtime data and agent skill"
depends = ["build"]
run = """
mkdir -p "$HOME/.local/bin" "$HOME/.local/share/omapixel/i18n" \
  "$HOME/.local/share/omapixel/agents/skills/omapixel"
install -m755 "$BUILD_DIR/bin/omapixel" "$HOME/.local/bin/omapixel"
install -m755 "$BUILD_DIR/bin/omapixel-studio" "$HOME/.local/bin/omapixel-studio"
# Beside the binaries, where an installed build looks for them. Without this
# an installed omapixel speaks English and cannot print its own default config.
install -m644 "{{config_root}}"/i18n/*.json "$HOME/.local/share/omapixel/i18n/"
install -m644 "{{config_root}}/config/config.toml" "$HOME/.local/share/omapixel/config.toml"
install -m644 "{{config_root}}"/agents/skills/omapixel/*.md \
  "$HOME/.local/share/omapixel/agents/skills/omapixel/"
echo "installed to $HOME/.local/bin"
echo
echo "to keep settings of your own:  omapixel config write"
echo "to teach your coding agent:    omapixel skill install"
"""
