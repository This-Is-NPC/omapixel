# Push a tag, get a release.
#
# The packages are not built here. omapixel is distributed through Omarchy's
# package repository, which compiles from the tarball GitHub makes of the tag --
# so a release carries notes and nothing else. Uploading binaries would be
# publishing something no one installs.
#
# The build goes through `mise run`, because that is the project's one entry
# point and a CI script that reimplements it is the second way to build.

name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

# The release job creates the release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: test and publish the release
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: system dependencies
        run: |
          pacman -Syu --needed --noconfirm git mise qt6-base qt6-declarative zstd

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: build and test
        run: |
          # The container clones as root into a directory git considers foreign.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mise trust
          mise run check

      - name: the version in the tag is the version in the tree
        run: |
          # version.pri and the tag are moved by hand, and a mismatch is only
          # visible once someone installs the package and asks. Cheaper here.
          tagged="${GITHUB_REF_NAME#v}"
          built="$(build/bin/omapixel --version | awk '{print $2}')"
          if [ "$tagged" != "$built" ]; then
            echo "::error::tag says $tagged, version.pri says $built"
            exit 1
          fi
          echo "both say $tagged"

      - name: the release notes
        run: |
          # GitHub's own generated notes list merged pull requests, and this
          # project has none -- every commit lands on master directly, so they
          # would come out empty. `mise run notes` reads the history instead.
          git fetch --tags --force
          mkdir -p dist
          OMAPIXEL_TAG="$GITHUB_REF_NAME" mise run notes > dist/NOTES.md
          cat dist/NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          body_path: dist/NOTES.md
