name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    env:
      XDG_RUNTIME_DIR: /tmp/omapixel-runtime
    steps:
      - name: system dependencies
        run: |
          pacman -Syu --needed --noconfirm git mise qt6-base qt6-declarative qt6-imageformats python hyprland weston wtype mesa zstd

      - uses: actions/checkout@v4

      - name: build and test
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          mise trust
          mise run check
