name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    env:
      XDG_RUNTIME_DIR: /tmp/omapixel-runtime
    steps:
      - name: system dependencies
        run: |
          pacman -Syu --needed --noconfirm git mise qt6-base qt6-declarative qt6-imageformats python sway wtype mesa zstd
          setcap -r /usr/bin/sway

      - uses: actions/checkout@v4

      - name: build and test
        run: |
          useradd --create-home --user-group omapixel-ci
          chown -R omapixel-ci:omapixel-ci "$GITHUB_WORKSPACE"
          install -d -o omapixel-ci -g omapixel-ci -m 700 "$XDG_RUNTIME_DIR"
          runuser -u omapixel-ci -- env \
            HOME=/home/omapixel-ci \
            XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash -lc 'cd "$GITHUB_WORKSPACE" && mise trust && mise run check'

  check-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: host tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils file libarchive-tools

      - name: build and test Arch Linux ARM package
        run: pkgbuild/check-aarch64.sh
